name: Selective Tests with Conda

on:
  workflow_dispatch:

  pull_request:

  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selective:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Detect changed files
        id: changes
        uses: tj-actions/changed-files@v41

      - name: Decide test scope
        id: decide
        run: |
          RUN_AUTO="false"
          RUN_EVAL="false"
          RUN_ALGO="false"
          ALGORITHMS=""
          
          echo "${{ steps.changes.outputs.all_changed_files }}" | tr ' ' '\n' > changed.txt

          if grep -E -q '^markdiffusion/watermark/(auto_watermark|base|auto_config|__init__)\.py$' changed.txt; then
            RUN_AUTO="true"
            echo "Detected core framework changes."
          fi

          if grep -E -q '^test/|^markdiffusion/evaluation/' changed.txt; then
            RUN_EVAL="true"
            echo "Detected evaluation/test changes."
          fi

          # Workflow self-changes should also trigger a real test run, otherwise
          # we can't validate the workflow update itself.
          if grep -E -q '^\.github/workflows/selective-tests\.yml$' changed.txt; then
            RUN_EVAL="true"
            echo "Detected CI workflow changes; running eval suite to validate."
          fi

          ALGOS_FROM_CONFIG=$(awk -F'/' '$1=="markdiffusion" && $2=="config" && $3 ~ /\.json$/ {n=$3; sub(/\.json$/,"",n); print n}' changed.txt | sort -u)
          ALGOS_FROM_DIR=$(awk -F'/' '$1=="markdiffusion" && $2=="watermark" && $3!="" && $3 !~ /\./ {print $3}' changed.txt | sort -u)
          ALGORITHMS=$(printf "%s\n%s\n" "$ALGOS_FROM_CONFIG" "$ALGOS_FROM_DIR" | grep -v '^$' | sort -u | paste -sd, -)

          if [ -n "$ALGORITHMS" ]; then
            RUN_ALGO="true"
          fi

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected. Forcing full test scope."
            RUN_AUTO="true"
            RUN_EVAL="true"
          fi

          echo "Run Auto: $RUN_AUTO"
          echo "Run Eval: $RUN_EVAL"
          echo "Run Algo: $RUN_ALGO"
          echo "Detected Algorithms: $ALGORITHMS"
          
          echo "run_auto=$RUN_AUTO" >> $GITHUB_OUTPUT
          echo "run_eval=$RUN_EVAL" >> $GITHUB_OUTPUT
          echo "run_algo=$RUN_ALGO" >> $GITHUB_OUTPUT
          echo "algorithms=$ALGORITHMS" >> $GITHUB_OUTPUT

      - name: Install system libs for opencv (libGL)
        # facexlib (transitive via pyiqa) pulls opencv-python which links libGL.so.1.
        # ubuntu-latest runners don't ship libgl1 by default, so cv2 import fails
        # unless we install it here (or unless opencv-python-headless wins the
        # site-packages race, which isn't guaranteed).
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libgl1

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: markdiffusion
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.11
            pip
            pyarrow
            pandas
            numpy<2.0
          cache-environment: true

      - name: Install local package and deps
        run: |
          micromamba run -n markdiffusion python -m pip install -U pip
          micromamba run -n markdiffusion pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          micromamba run -n markdiffusion pip install -e '.[optional]' --no-cache-dir
          # openai-clip 1.0.1 (pulled transitively via pyiqa) imports
          # `from pkg_resources import packaging`, which setuptools' own
          # deprecation message tells you to "pin to Setuptools<81". Recent
          # 81.x patches stop returning it entirely (hard ImportError on CI).
          # Done last so the [optional] resolver doesn't re-bump it.
          micromamba run -n markdiffusion pip install --force-reinstall --no-deps 'setuptools<81'

      - name: Run evaluation fast tests
        if: steps.decide.outputs.run_eval == 'true'
        run: |
          micromamba run -n markdiffusion pytest -q tests_ci/test_pipelines.py --maxfail=1 --disable-warnings

      - name: Run all algorithms (init/interface only)
        if: steps.decide.outputs.run_auto == 'true'
        run: |
          micromamba run -n markdiffusion pytest -q tests_ci/test_watermark_algorithms.py \
            --skip-generation --skip-detection \
            --maxfail=1 --disable-warnings

      - name: Run specific algorithms (filtered)
        if: steps.decide.outputs.run_algo == 'true' && steps.decide.outputs.run_auto != 'true'
        env:
          ALGORITHMS: ${{ steps.decide.outputs.algorithms }}
        run: |
          echo "Algorithms changed: $ALGORITHMS"
          micromamba run -n markdiffusion pytest -q tests_ci/test_watermark_algorithms.py \
            --algorithm "$ALGORITHMS" \
            --maxfail=1 --disable-warnings

      - name: No tests needed
        if: steps.decide.outputs.run_auto == 'false' && steps.decide.outputs.run_eval == 'false' && steps.decide.outputs.run_algo == 'false'
        run: echo "No relevant changes detected. Skipping tests."